name: Release

on:
  push:
    branches: [master]
    paths:
      - package.json
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - renderer/**
      - src-tauri/src/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(jq -r .version package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout tauri-tray-base
        uses: actions/checkout@v4
        with:
          repository: taylorivanoff/tauri-tray-base
          path: tauri-tray-base
      - name: Materialize shared-styles
        shell: bash
        run: |
          mkdir -p shared-styles
          cp app/renderer/vendor/shared-styles/*.css shared-styles/
          cat > shared-styles/package.json <<'EOF'
          {
            "name": "@taylorivanoff/shared-styles",
            "version": "0.0.0",
            "files": ["tokens.css", "base.css", "window.css", "index.css"],
            "exports": {
              ".": "./index.css",
              "./tokens.css": "./tokens.css",
              "./base.css": "./base.css",
              "./window.css": "./window.css",
              "./index.css": "./index.css"
            },
            "style": "index.css"
          }
          EOF
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frontend deps
        working-directory: app
        run: npm install
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
